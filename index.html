<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spotter">
<meta name="theme-color" content="#EFEDE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121517" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Spotter</title>
<style>
:root{
  --bg:#EFEDE8; --bg2:#E6E3DC; --ink:#1E2022; --ink2:rgba(30,32,34,.64); --ink3:rgba(30,32,34,.40);
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.36); --brd:rgba(30,32,34,.08); --brd2:rgba(255,255,255,.85);
  --shadow:0 18px 40px -22px rgba(40,44,48,.35), 0 2px 6px -2px rgba(40,44,48,.08);
  --accent:#2E7F73; --warn:#A84848; --up:#2E7F73;
  --c-grande:#94702A; --c-costruzione:#2E7F73; --c-finisher:#A8583C; --c-valvola:#6553A8; --c-attivazione:#3F73A3; --c-libero:#6E7275;
  --orb1:#FFFFFF; --orb2:#BFE3D8; --orb3:#D6CCF0; --orbop:.85;
  --role:var(--accent);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121517; --bg2:#171B1E; --ink:#E4E2DC; --ink2:rgba(228,226,220,.64); --ink3:rgba(228,226,220,.38);
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.03); --brd:rgba(255,255,255,.09); --brd2:rgba(255,255,255,.14);
  --shadow:0 22px 44px -24px rgba(0,0,0,.7), 0 1px 0 0 rgba(255,255,255,.04) inset;
  --accent:#8CCBBF; --warn:#E59A9A; --up:#8CCBBF;
  --c-grande:#D9B777; --c-costruzione:#8CCBBF; --c-finisher:#E09A82; --c-valvola:#B5A8E6; --c-attivazione:#94BCE0; --c-libero:#9A9D9F;
  --orb1:#1F4A47; --orb2:#3A2F5C; --orb3:#5A4424; --orbop:.55;
}}
:root[data-theme="dark"]{
  --bg:#121517; --bg2:#171B1E; --ink:#E4E2DC; --ink2:rgba(228,226,220,.64); --ink3:rgba(228,226,220,.38);
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.03); --brd:rgba(255,255,255,.09); --brd2:rgba(255,255,255,.14);
  --shadow:0 22px 44px -24px rgba(0,0,0,.7), 0 1px 0 0 rgba(255,255,255,.04) inset;
  --accent:#8CCBBF; --warn:#E59A9A; --up:#8CCBBF;
  --c-grande:#D9B777; --c-costruzione:#8CCBBF; --c-finisher:#E09A82; --c-valvola:#B5A8E6; --c-attivazione:#94BCE0; --c-libero:#9A9D9F;
  --orb1:#1F4A47; --orb2:#3A2F5C; --orb3:#5A4424; --orbop:.55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
textarea,input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}

/* orbs */
.orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--orbop);will-change:transform}
.orbs i:nth-child(1){width:78vw;height:78vw;left:-24vw;top:-14vw;background:var(--orb1);animation:d1 34s ease-in-out infinite alternate}
.orbs i:nth-child(2){width:70vw;height:70vw;right:-26vw;top:30vh;background:var(--orb2);animation:d2 40s ease-in-out infinite alternate}
.orbs i:nth-child(3){width:64vw;height:64vw;left:6vw;bottom:-26vw;background:var(--orb3);animation:d3 28s ease-in-out infinite alternate}
.orbs i.tint{width:56vw;height:56vw;right:-10vw;top:-16vw;left:auto;background:var(--role);opacity:.22;transition:background-color .7s ease;animation:d2 30s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(12vw,10vh) scale(1.12)}}
@keyframes d2{to{transform:translate(-14vw,-8vh) scale(.92)}}
@keyframes d3{to{transform:translate(10vw,-9vh) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.orbs i{animation:none}}

#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px calc(28px + env(safe-area-inset-bottom))}
.glass{background:var(--glass);border:1px solid var(--brd);border-radius:26px;box-shadow:var(--shadow);position:relative}
.glass.blur{-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,var(--brd2),transparent 32%);-webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;opacity:.9}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}

/* home */
.hero-h{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 4px 18px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:46px;height:46px}
.brand h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1}
.brand p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--brd)}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:22px 6px 10px}
.rcard{display:block;width:100%;text-align:left;padding:18px 18px 16px;margin-bottom:12px;transition:transform .18s ease}
.rcard:active{transform:scale(.985)}
.rtop{display:flex;gap:14px;align-items:center}
.mono{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:24px;font-weight:700;flex:none;
  background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 24%,transparent),color-mix(in srgb,var(--accent) 6%,transparent));
  color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent)}
.rname{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.rmeta{font-size:12.5px;color:var(--ink2);margin-top:3px}
.rbig{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2)}
.rbig b{color:var(--ink);font-weight:600}
.pills{display:flex;gap:4px;margin-top:12px}
.pills i{flex:1;height:5px;border-radius:3px;background:var(--c);opacity:.8}
.banner{padding:14px 16px;margin-bottom:12px;border-radius:22px}
.banner .t{font-weight:600;font-size:15px}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.empty{text-align:center;padding:30px 20px;color:var(--ink2);font-size:14.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:18px;font-weight:600;font-size:16px;
  background:var(--ink);color:var(--bg);transition:transform .15s ease,opacity .2s}
.btn:active{transform:scale(.98)} .btn[disabled]{opacity:.4}
.btn.soft{background:var(--glass);color:var(--ink);border:1px solid var(--brd)}
.btn.acc{background:var(--accent);color:var(--bg)}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:14px;width:auto}
.row{display:flex;gap:10px} .row>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:50;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:all .3s ease;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* session */
.sbar{display:flex;align-items:center;gap:10px;padding:8px 14px 8px}
.sbar .ttl{flex:1;min-width:0;text-align:center}
.sbar .ttl b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .ttl span{font-size:12px;color:var(--ink2)}
.segs{display:flex;gap:4px;padding:2px 18px 10px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--brd);position:relative;overflow:hidden;transition:all .3s}
.segs i.noted{background:color-mix(in srgb,var(--c) 45%,transparent)}
.segs i.cur{background:var(--c);transform:scaleY(1.6)}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:none;width:100%;height:100%;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;padding:4px 16px 120px;-webkit-overflow-scrolling:touch}
.card{padding:18px;margin-bottom:12px}
.hero{padding:20px 20px 16px;overflow:hidden}
.hero .glow{position:absolute;right:-70px;top:-90px;width:240px;height:240px;border-radius:50%;background:var(--c);opacity:.20;filter:blur(50px);pointer-events:none}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 26%,transparent)}
.badge.alt{--c:var(--ink2);font-weight:650}
.ex-title{font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:0}
.tagline{font-size:13.5px;color:var(--ink2);margin-top:6px}
.hero-grid{display:flex;align-items:center;gap:8px;margin-top:10px}
.dial{flex:none;width:168px;height:104px;position:relative}
.dial svg{width:100%;height:100%;overflow:visible}
.dial .v{position:absolute;left:0;right:0;bottom:0;text-align:center}
.dial .v b{display:block;font-size:30px;font-weight:700;line-height:1;color:var(--c)}
.dial .v span{font-size:10.5px;letter-spacing:.14em;color:var(--ink3);font-weight:700}
.facts{flex:1;display:flex;flex-direction:column;gap:9px;padding-left:6px;min-width:0}
.fact .lbl{display:block;margin-bottom:1px;font-size:10px}
.fact b{font-size:19px;font-weight:650;letter-spacing:-.02em}
.fact small{font-size:12px;color:var(--ink2);font-weight:500}
.qual{font-size:12.5px;color:var(--ink2);margin-top:8px;text-align:left}

.sets{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.set{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--brd)}
.set:first-child{border-top:0}
.tag{width:38px;flex:none;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ink3)}
.set.top .tag{color:var(--c)}
.set .w{font-size:23px;font-weight:650;letter-spacing:-.02em;min-width:92px}
.set .w small{font-size:12.5px;color:var(--ink2);font-weight:500;margin-left:3px}
.set .r{flex:1;font-size:15px;color:var(--ink2)}
.set .r b{color:var(--ink);font-weight:650}
.goal{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.warm{font-size:13px;color:var(--ink3);padding-bottom:8px;border-bottom:1px dashed var(--brd);margin-bottom:2px}
.trigger{margin-top:12px;padding:12px 14px;border-radius:16px;font-size:13.5px;line-height:1.4;background:color-mix(in srgb,var(--c) 9%,transparent);color:var(--ink)}
.trigger b{color:var(--c)}
.callout{display:flex;gap:10px;padding:13px 15px;border-radius:18px;margin-bottom:10px;font-size:14px;line-height:1.42;border:1px solid var(--brd);background:var(--glass);user-select:text;-webkit-user-select:text}
.callout .ic{flex:none;font-size:15px;line-height:1.35}
.callout.warn{background:color-mix(in srgb,var(--warn) 10%,var(--glass));border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.callout.target{background:color-mix(in srgb,var(--c) 10%,var(--glass));border-color:color-mix(in srgb,var(--c) 28%,transparent)}
.callout.up{background:color-mix(in srgb,var(--up) 10%,var(--glass));border-color:color-mix(in srgb,var(--up) 28%,transparent)}
.h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.h3 b{font-size:16px;font-weight:650;letter-spacing:-.01em}
.scope{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.scope::-webkit-scrollbar{display:none}
.scope button{flex:none;padding:8px 14px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--ink2);background:var(--glass2);border:1px solid var(--brd);position:relative}
.scope button.on{background:var(--ink);color:var(--bg);border-color:transparent}
.scope button .dot{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--c)}
.chipg{margin-bottom:10px}
.chipg .lbl{display:block;margin-bottom:7px;font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:550;background:var(--glass2);border:1px solid var(--brd);color:var(--ink);transition:all .15s ease}
.chip:active{transform:scale(.95)}
.chip.on{background:color-mix(in srgb,var(--c) 20%,transparent);border-color:color-mix(in srgb,var(--c) 55%,transparent);color:var(--c);font-weight:650}
.chip.body.on{--c:var(--warn)}
.pain{margin:14px 0 4px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--warn) 8%,transparent);border:1px solid color-mix(in srgb,var(--warn) 22%,transparent)}
.pain .ph{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-bottom:10px;font-size:13.5px;font-weight:600}
.pain .ph span{color:var(--ink2);font-weight:500;font-size:12.5px}
.dots{display:flex;gap:4px}
.dots button{flex:1;height:38px;border-radius:11px;font-size:14px;font-weight:650;background:var(--glass2);border:1px solid var(--brd);color:var(--ink2)}
.dots button.on{background:var(--warn);color:var(--bg);border-color:transparent}
.dots button.on.zero{background:var(--accent)}
textarea.ta{width:100%;min-height:92px;resize:none;border-radius:16px;padding:13px 14px;background:var(--glass2);border:1px solid var(--brd);outline:0;line-height:1.4;display:block;margin-top:12px}
textarea.ta:focus,input.in:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
textarea.ta::placeholder,input.in::placeholder{color:var(--ink3)}
.note-full{font-size:14px;line-height:1.5;color:var(--ink2);user-select:text;-webkit-user-select:text}
.note-full p{margin:0 0 9px}
.note-full.clamp{max-height:4.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 40%,transparent)}
.more{font-size:13px;font-weight:650;color:var(--accent);margin-top:4px}
.hrow{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--brd);font-size:14px;align-items:baseline}
.hrow:first-of-type{border-top:0}
.hrow .d{width:52px;flex:none;color:var(--ink2);font-size:12.5px;font-weight:600}
.hrow .s{flex:1;display:flex;flex-wrap:wrap;gap:4px 10px}
.hrow .s span{white-space:nowrap}
.hrow .s em{font-style:normal;color:var(--ink3);font-size:12.5px;margin-left:2px}
.hrow .s em.over{color:var(--warn);font-weight:700}
.snav{position:absolute;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:5;
  background:linear-gradient(transparent,var(--bg) 46%)}
.snav .mid{flex:1;height:54px;border-radius:19px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:650;font-size:15px}
.snav .arrow{width:54px;height:54px;border-radius:19px;display:grid;place-items:center;flex:none}
.snav .arrow svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snav .arrow[disabled]{opacity:.3}
.snav .end{flex:none;padding:0 20px;height:54px;border-radius:19px;background:var(--accent);color:var(--bg);font-weight:700;font-size:15px}
.wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.38);opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:82vh;overflow-y:auto;border-radius:30px 30px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  background:var(--bg2);border-top:1px solid var(--brd2);transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--brd);margin:2px auto 14px;background:var(--ink3);opacity:.5}
.irow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-top:1px solid var(--brd)}
.irow:first-of-type{border-top:0}
.irow .n{width:24px;color:var(--ink3);font-size:13px;font-weight:600}
.irow .e{font-size:18px;width:26px;text-align:center}
.irow .x{flex:1;min-width:0}
.irow .x b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .x span{font-size:12.5px;color:var(--ink2)}
.irow .ck{width:9px;height:9px;border-radius:50%;background:var(--c)}
.irow.cur b{color:var(--c)}

/* forms */
.seg{display:flex;padding:4px;border-radius:15px;background:var(--glass2);border:1px solid var(--brd);gap:2px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
input.in{width:100%;border-radius:15px;padding:14px;background:var(--glass2);border:1px solid var(--brd);outline:0}
pre.exp{white-space:pre-wrap;word-break:break-word;font:500 12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2);margin:0;user-select:text;-webkit-user-select:text}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 0 14px}
.topbar h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.03em;flex:1}
.status{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.4}
.status.ok{color:var(--accent)} .status.err{color:var(--warn)}
.fade{animation:fd .35s ease both}
.view.fade{animation-name:fd0}
@keyframes fd0{from{opacity:0}}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<div class="orbs"><i></i><i></i><i></i><i class="tint"></i></div>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const VERSION = '1.0';
const API = 'https://api.hevyapp.com';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- storage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('spotter.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('spotter.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('spotter.' + k); } catch (e) {} }
};

/* ---------- formatting ---------- */

/* ---------- note parser: la riga 1 delle note Hevy è il contratto ---------- */
const ROLES = {
  grande:      { emoji: '🏆', name: 'Grande',      lo: 8,    hi: 9.5 },
  costruzione: { emoji: '🪜', name: 'Costruzione', lo: null, hi: 8 },
  finisher:    { emoji: '🔥', name: 'Finisher',    lo: 8,    hi: 9.5 },
  valvola:     { emoji: '🚦', name: 'Valvola',     lo: null, hi: 7.5 },
  attivazione: { emoji: '🔋', name: 'Attivazione', lo: null, hi: 7 },
  libero:      { emoji: '•',  name: 'Esercizio',   lo: null, hi: null }
};
const num = s => parseFloat(String(s).replace(',', '.'));
function parseNote(raw) {
  const out = { role: 'libero', lo: null, hi: null, fromPolicy: false, qual: '', tagline: '', badges: [], lines: [] };
  const text = String(raw || '').replace(/\r/g, '').trim();
  if (!text) return out;
  const all = text.split('\n').map(s => s.trim()).filter(Boolean);
  let first = all[0], body = all.slice(1);
  let role = null;
  for (const k in ROLES) if (k !== 'libero' && first.includes(ROLES[k].emoji)) role = k;
  if (!role) { const m = first.match(/\b(GRANDE|COSTRUZIONE|FINISHER|VALVOLA|ATTIVAZIONE)\b/); if (m) role = m[1].toLowerCase(); }
  const rm = first.match(/RPE\s*(?:fino\s+a\s*|≤\s*|<=\s*)?(\d{1,2}(?:[.,]\d)?)(?:\s*[-–]\s*(\d{1,2}(?:[.,]\d)?))?/i);
  if (!role && !rm) { body = all; first = ''; }
  out.role = role || 'libero';
  if (rm) {
    if (rm[2]) { out.lo = num(rm[1]); out.hi = num(rm[2]); } else { out.hi = num(rm[1]); }
    let rest = first.slice(rm.index + rm[0].length);
    const cut = rest.search(/\s[—–]\s|\(|·/);
    out.qual = (cut >= 0 ? rest.slice(0, cut) : rest).trim().replace(/^[,:;]\s*/, '');
  } else if (role) { out.lo = ROLES[role].lo; out.hi = ROLES[role].hi; out.fromPolicy = true; }
  if (first) { const t = first.split(/\s[—–]\s/); if (t.length > 1) out.tagline = t.slice(1).join(' — ').trim(); }
  const bset = new Set();
  const lm = text.match(/LETTURA\s+\d+\s+DI\s+\d+/); if (lm) bset.add(lm[0]);
  [['TARATURA', /\bTARATURA\b/], ['TEST', /\bTEST\b/], ['VERIFICA', /\bVERIFICA\b/], ['DELOAD', /\bDELOAD\b/]].forEach(([n, re]) => { if (re.test(text)) bset.add(n); });
  out.badges = [...bset];
  out.lines = body.map(l => {
    if (/^⚠/.test(l)) return { type: 'warn', text: l.replace(/^⚠️?\s*/, '') };
    if (/^⬆/.test(l)) return { type: 'up', text: l.replace(/^⬆️?\s*/, '') };
    if (/bersaglio/i.test(l)) return { type: 'target', text: l };
    return { type: 'text', text: l };
  });
  return out;
}
const isWork = s => s.type !== 'warmup';
function analyze(ex) {
  const p = parseNote(ex.notes);
  const work = (ex.sets || []).filter(isWork), warm = (ex.sets || []).filter(s => !isWork(s));
  const maxW = work.reduce((m, s) => Math.max(m, s.weight_kg || 0), 0);
  const mixed = maxW > 0 && work.some(s => (s.weight_kg || 0) < maxW);
  const tops = work.filter(s => maxW > 0 ? (s.weight_kg || 0) === maxW : true);
  const rr = (tops[0] && tops[0].rep_range) || (work[0] && work[0].rep_range) || null;
  const range = rr && rr.start != null && rr.end != null ? { lo: rr.start, hi: rr.end } : null;
  const tarat = p.badges.includes('TARATURA'), deload = p.badges.includes('DELOAD');
  let trig;
  const cap = p.hi != null ? fmt(p.hi) : null;
  if (p.role === 'valvola') trig = '<b>Valvola.</b> Misura, non allena: carico e ripetizioni fissi, si legge su tutte le serie' + (cap ? ' entro RPE ' + cap : '') + '. Dolore 0–10 durante e a 2 ore.';
  else if (p.role === 'attivazione') trig = '<b>Attivazione.</b> Resta leggera: prepara, non affatica.';
  else if (deload) trig = '<b>Deload.</b> Nessuna progressione oggi: dice solo se sei pronto.';
  else if (tarat) trig = '<b>Taratura.</b> Oggi si fissano i numeri: segna gli RPE veri, nessun trigger.';
  else if (range && work.length) {
    const n = tops.length;
    trig = '<b>Trigger:</b> ' + range.hi + ' reps ' + (n === 1 ? 'sul top set' : 'su tutte e ' + n + ' le serie') + (maxW ? ' a ' + fmt(maxW) + ' kg' : '') + (cap ? ' entro RPE ' + cap : '') + ' → il carico sale di uno scatto.' + (mixed ? ' I back-down non contano.' : '');
  } else trig = '';
  return { p, work, warm, maxW, mixed, tops, range, trig };
}

async function api(path) {
  const r = await fetch(API + path, { headers: { 'api-key': S.key } });
  if (r.status === 401 || r.status === 403) throw new Error('Chiave API non valida');
  if (r.status === 429) throw new Error('Troppe richieste a Hevy: riprova fra un minuto');

}
async function loadRoutines(force) {

  S.loading = true; S.err = ''; if (S.view === 'home') render();
  try {
    let list = [], p = 1, pc = 1;
    do { const j = await api('/v1/routines?page=' + p + '&pageSize=10'); list = list.concat(j.routines || []); pc = j.page_count || 1; p++; } while (p <= pc && p < 12);
    list.sort((a, b) => String(a.title).localeCompare(String(b.title), 'it'));
    S.routines = { at: Date.now(), list }; LS.set('routines', S.routines);
  } catch (e) { S.err = e.message === 'Failed to fetch' || /load failed/i.test(e.message) ? 'Senza rete: mostro l\'ultima copia salvata' : e.message; if (!S.routines || S.routines.demo) S.routines = LS.get('routines', null); }
  S.loading = false; if (S.view === 'home') render();
}
async function getHistory(ex) {

  const cache = LS.get('hist', {}), c = cache[ex.tid];
  if (c && Date.now() - c.at < 6 * 36e5) return c.s;
  const from = new Date(Date.now() - 90 * 864e5).toISOString();
  const j = await api('/v1/exercise_history/' + encodeURIComponent(ex.tid) + '?start_date=' + encodeURIComponent(from));
  const by = new Map();

    if (h.set_type === 'warmup') return;
    if (!by.has(h.workout_id)) by.set(h.workout_id, { id: h.workout_id, start: h.workout_start_time, sets: [] });
    by.get(h.workout_id).sets.push({ w: h.weight_kg, r: h.reps, rpe: h.rpe });

  const s = [...by.values()].sort((a, b) => new Date(b.start) - new Date(a.start)).slice(0, 3);

}

}
function vArchive() {
  let h = '<div class="view fade"><div class="topbar"><button class="icon-btn" data-act="home">' + ICON.back + '</button><h2>Archivio</h2></div>';
  if (!S.archive.length) h += '<div class="empty">Qui finiscono le sedute chiuse, con i tuoi appunti.<br>Puoi riaprirle e ricondividerle.</div>';
  S.archive.forEach(c => { const m = monogram(c.title); h += '<button class="glass rcard" data-act="openarch" data-id="' + c.id + '"><div class="rtop"><div class="mono num">' + esc(m.l) + '</div><div style="min-width:0"><div class="rname">' + esc(m.n) + '</div><div class="rmeta">' + dLong(c.startedAt) + ' · ' + esc(c.gym) + ' · ' + c.exercises.filter(hasNote).length + ' annotati</div></div></div></button>'; });
  return h + '</div>';
}
function vArchItem() {
  const c = S.archive.find(x => x.id === S.archId); if (!c) return vArchive();
  const valves = c.exercises.map((e, i) => ({ e, i })).filter(x => analyze(x.e).p.role === 'valvola');
  let h = '<div class="view fade"><div class="topbar"><button class="icon-btn" data-act="archive">' + ICON.back + '</button><h2>' + esc(monogram(c.title).n) + '</h2></div>';
  valves.forEach(v => { h += '<div class="pain" style="margin:0 0 12px"><div class="ph">🚦 ' + esc(v.e.title) + ' <span>dolore a 2 ore</span></div><div class="dots">' + Array.from({ length: 11 }, (_, n) => '<button class="' + (v.e.my.pain2h === n ? 'on' + (n === 0 ? ' zero' : '') : '') + '" data-act="apain2h" data-i="' + v.i + '" data-n="' + n + '">' + n + '</button>').join('') + '</div></div>'; });
  h += '<div class="glass card"><pre class="exp">' + esc(buildExport(c)) + '</pre></div><button class="btn acc" data-act="ashare">Condividi di nuovo</button><div style="height:10px"></div><div class="row"><button class="btn soft" data-act="acopy">Copia testo</button><button class="btn soft" data-act="adel" id="adel">Elimina</button></div></div>';
  return h;
}
function vSettings() {
  const th = LS.get('theme', 'auto'), gym = LS.get('gym', GYMS[0]);
  return '<div class="view fade"><div class="topbar"><button class="icon-btn" data-act="home">' + ICON.back + '</button><h2>Impostazioni</h2></div>' +
    '<div class="glass blur card"><div class="h3"><b>Chiave API di Hevy</b></div><div class="muted" style="font-size:13.5px;margin:-6px 0 12px">Hevy → Settings → Developer (serve Hevy Pro). La chiave resta solo su questo telefono: non finisce nel repo né altrove.</div>' +
    '<input class="in" id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="incolla qui la chiave" value="' + esc(S.key) + '"><div style="height:10px"></div><div class="row"><button class="btn acc" data-act="savekey">Salva e verifica</button>' + (S.key ? '<button class="btn soft" data-act="delkey">Rimuovi</button>' : '') + '</div><div class="status" id="keystatus"></div></div>' +
    '<div class="glass card"><span class="lbl" style="display:block;margin-bottom:8px">Tema</span><div class="seg">' + [['auto', 'Automatico'], ['light', 'Chiaro'], ['dark', 'Scuro']].map(x => '<button class="' + (th === x[0] ? 'on' : '') + '" data-act="theme" data-v="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>' +
    '<span class="lbl" style="display:block;margin:16px 0 8px">Palestra predefinita</span><div class="seg">' + GYMS.map(x => '<button class="' + (gym === x ? 'on' : '') + '" data-act="defgym" data-v="' + x + '">' + x + '</button>').join('') + '</div></div>' +
    '<div class="glass card"><div class="h3"><b>Dati</b></div><div class="muted" style="font-size:13.5px;margin:-6px 0 12px">Schede e storico sono copie locali per lavorare anche senza rete. Gli appunti archiviati non vengono toccati.</div><button class="btn soft" data-act="clearcache">Svuota copie locali di Hevy</button></div>' +
    '<div class="faint" style="text-align:center;font-size:12px;margin-top:8px">Spotter ' + VERSION + '</div></div>';
}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  if (ev.target.id === 'scrim') return closeSheet();
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, c = S.cur;
  switch (act) {
    case 'settings': case 'archive': go(act); break;
    case 'home': go('home'); loadRoutines(); break;
    case 'refresh': loadRoutines(true); break;
    case 'resume': go('session'); break;
    case 'start': { const r = S.routines.list[i]; if (S.cur && S.cur.routineId !== r.id) { openSheet('<div class="grab"></div><div class="h3" style="margin:0 4px 8px"><b style="font-size:19px">C\'è già una seduta aperta</b></div><div class="muted" style="margin:0 4px 16px;font-size:14.5px">' + esc(S.cur.title) + ', iniziata alle ' + hm(S.cur.startedAt) + '. Cosa ne faccio?</div><button class="btn acc" data-act="resume">Riprendila</button><div style="height:10px"></div><button class="btn soft" data-act="replace" data-i="' + i + '">Archiviala e apri ' + esc(monogram(r.title).n) + '</button>'); } else if (S.cur) go('session'); else startSession(r); break; }
    case 'replace': { const r = S.routines.list[i]; S.cur.closedAt = new Date().toISOString(); S.archive.unshift(S.cur); saveArch(); S.cur = null; startSession(r); break; }
    case 'prev': goPage(S.page - 1); break;
    case 'next': goPage(S.page + 1); break;
    case 'index': openSheet(vIndex()); break;
    case 'jump': closeSheet(); goPage(i); break;
    case 'abandon': if (b.dataset.sure) { S.cur = null; saveCur(); go('home'); toast('Seduta annullata'); } else { b.dataset.sure = '1'; b.textContent = 'Tocca ancora per confermare: gli appunti si perdono'; } break;
    case 'toclose': S.anchor = null; go('close'); break;
    case 'scope': S.scope[i] = b.dataset.s; repaintMy(i); break;
    case 'chip': { const e = c.exercises[i], sc = S.scope[i] || 'all', arr = e.my.chips[sc] || (e.my.chips[sc] = []), k = arr.indexOf(b.dataset.c); k >= 0 ? arr.splice(k, 1) : arr.push(b.dataset.c); saveCur(); repaintMy(i); break; }
    case 'showpain': c.exercises[i].my.showPain = true; repaintMy(i); break;
    case 'pain': { const e = c.exercises[i], n = +b.dataset.n; e.my.pain = e.my.pain === n ? null : n; saveCur(); repaintMy(i); break; }
    case 'cpain': { const e = c.exercises[i], n = +b.dataset.n; e.my.pain = e.my.pain === n ? null : n; saveCur(); const st = $('.view').scrollTop; render(); $('.view').scrollTop = st; break; }
    case 'morenote': S.openNote[i] = !S.openNote[i]; $('#nf-' + i).classList.toggle('clamp', !S.openNote[i]); b.textContent = S.openNote[i] ? 'Riduci' : 'Leggi tutto'; break;
    case 'gym': c.gym = b.dataset.v; saveCur(); { const st = $('.view').scrollTop; render(); $('.view').scrollTop = st; } break;
    case 'feel': c.general.feel = c.general.feel === b.dataset.v ? null : b.dataset.v; saveCur(); { const st = $('.view').scrollTop; render(); $('.view').scrollTop = st; } break;
    case 'flag': { const a = c.general.flags, k = a.indexOf(b.dataset.v); k >= 0 ? a.splice(k, 1) : a.push(b.dataset.v); saveCur(); { const st = $('.view').scrollTop; render(); $('.view').scrollTop = st; } break; }
    case 'reanchor': anchorHevy(); break;
    case 'share': shareText(buildExport(c), 'Spotter · ' + c.title); break;
    case 'copy': copyText(buildExport(c)); break;
    case 'ics': icsReminder(c); break;
    case 'doarchive': archiveCurrent(); break;
    case 'openarch': S.archId = b.dataset.id; go('archItem'); break;
    case 'apain2h': { const a = S.archive.find(x => x.id === S.archId), n = +b.dataset.n; a.exercises[i].my.pain2h = a.exercises[i].my.pain2h === n ? null : n; saveArch(); render(); break; }
    case 'pain2h': { const p = pendingPain()[+b.dataset.k]; if (!p) break; const n = +b.dataset.n; p.e.my.pain2h = n; p.where === 'arch' ? saveArch() : saveCur(); S.painShare = { n, title: p.e.title, text: 'SPOTTER · aggiornamento valvola\n' + p.e.title + ' — ' + p.c.title + ', ' + dLong(p.c.startedAt) + '\nDolore durante: ' + (p.e.my.pain != null ? p.e.my.pain + '/10' : 'non raccolto') + ' · a 2 ore: ' + n + '/10' }; render(); break; }
    case 'sharepain': if (S.painShare) { await shareText(S.painShare.text, 'Spotter · valvola'); } break;
    case 'dismisspain': S.painShare = null; render(); break;
    case 'ashare': { const a = S.archive.find(x => x.id === S.archId); shareText(buildExport(a), 'Spotter · ' + a.title); break; }
    case 'acopy': copyText(buildExport(S.archive.find(x => x.id === S.archId))); break;
    case 'adel': if (b.dataset.sure) { S.archive = S.archive.filter(x => x.id !== S.archId); saveArch(); go('archive'); } else { b.dataset.sure = '1'; b.textContent = 'Confermi?'; } break;
    case 'theme': LS.set('theme', b.dataset.v); applyTheme(); render(); break;
    case 'defgym': LS.set('gym', b.dataset.v); render(); break;
    case 'clearcache': LS.del('routines'); LS.del('hist'); S.routines = null; toast('Copie locali svuotate'); loadRoutines(true); break;
    case 'delkey': S.key = ''; LS.del('key'); LS.del('routines'); LS.del('hist'); S.routines = null; await loadRoutines(); render(); break;
    case 'savekey': {
      const v = $('#key').value.trim(), st = $('#keystatus'); if (!v) { st.className = 'status err'; st.textContent = 'Incolla prima la chiave.'; break; }
      S.key = v; st.className = 'status'; st.textContent = 'Verifico con Hevy…';
      try { await api('/v1/routines?page=1&pageSize=1'); LS.set('key', v); st.className = 'status ok'; st.textContent = 'Collegato. Leggo le tue schede…'; await loadRoutines(true); go('home'); }
      catch (e) { S.key = LS.get('key', ''); st.className = 'status err'; st.textContent = /fetch|load failed/i.test(e.message) ? 'Hevy non raggiungibile: controlla la rete.' : e.message; }
      break;
    }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target; if (!t.dataset || !t.dataset.in || !S.cur) return;
  if (t.dataset.in === 'text') { S.cur.exercises[+t.dataset.i].my.text = t.value; clearTimeout(document._pn); document._pn = setTimeout(paintNav, 400); }
  else { S.cur.general.text = t.value; const pre = $('#exp'); if (pre) pre.textContent = buildExport(S.cur); }
  saveCur(); t.style.height = 'auto'; t.style.height = Math.max(92, t.scrollHeight + 2) + 'px';
});
window.addEventListener('resize', () => { const p = $('#pager'); if (p) p.scrollLeft = S.page * p.clientWidth; });

/* ---------- boot ---------- */
applyTheme();
if (!S.routines || !S.key) S.routines = S.key ? S.routines : { at: Date.now(), list: DEMO, demo: true };
render(); loadRoutines();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});

</script>
</body>
</html>
